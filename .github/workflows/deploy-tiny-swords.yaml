name: Deploy tiny_swords

on:
  push:
    branches: [master]
    paths:
      - "tiny_swords/**"
      - "!tiny_swords/node_modules/**"
      - "!tiny_swords/tests/**"
      - "!tiny_swords/test-results/**"
      - "!tiny_swords/package.json"
      - "!tiny_swords/package-lock.json"
      - "!tiny_swords/.github/**"
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          rsync -a --exclude='node_modules' --exclude='tests' --exclude='test-results' \
            --exclude='.github' --exclude='.gitignore' --exclude='package.json' \
            --exclude='package-lock.json' --exclude='eslint.config.js' \
            --exclude='playwright.config.js' --exclude='CLAUDE.md' \
            ./tiny_swords/ deploy/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          target-folder: tiny_swords
          clean: false
