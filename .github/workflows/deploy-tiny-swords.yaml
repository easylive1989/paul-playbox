name: Deploy tiny_swords

on:
  push:
    branches: [master]
    paths:
      - "tiny_swords/**"
      - "!tiny_swords/node_modules/**"
      - "!tiny_swords/tests/**"
      - "!tiny_swords/test-results/**"
      - "!tiny_swords/package.json"
      - "!tiny_swords/package-lock.json"
      - "!tiny_swords/.github/**"
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tiny_swords
          destination_dir: tiny_swords
          keep_files: true
          exclude_assets: "node_modules,tests,test-results,.github,.gitignore,package.json,package-lock.json,eslint.config.js,playwright.config.js,CLAUDE.md"
