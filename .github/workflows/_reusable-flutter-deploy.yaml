name: Reusable Flutter Deploy

on:
  workflow_call:
    inputs:
      project_dir:
        required: true
        type: string
        description: "Directory name of the Flutter project"
      flutter_version:
        required: false
        type: string
        default: "3.29.2"
        description: "Flutter version to use"

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable

      - name: Build Flutter web
        working-directory: ${{ inputs.project_dir }}
        run: flutter build web --release --base-href "/paul-playbox/${{ inputs.project_dir }}/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ inputs.project_dir }}/build/web
          destination_dir: ${{ inputs.project_dir }}
          keep_files: true
