name: Deploy Games to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'flutter_breakout/**'
      - 'flutter_tetris/**'
      - 'player_ns_shaft/**'
      - 'ray_world_game/**'
      - 'water_sort_puzzle/**'
      - 'tiny_swords/**'
      - 'water_bottle_flip/**'
      - 'stock_trading_game/**'
      - 'sokoban/**'
      - '.github/workflows/deploy-games.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: flutter_breakout
            working-directory: flutter_breakout
            base-href: /paul-playbox/flutter_breakout/
            flutter-version: '3.7.10'
            build-args: "--web-renderer html"
            target: ""
          - project: flutter_tetris
            working-directory: flutter_tetris
            base-href: /paul-playbox/flutter_tetris/
            flutter-version: '3.7.10'
            build-args: "--web-renderer html"
            target: ""
          - project: ray_world_game
            working-directory: ray_world_game
            base-href: /paul-playbox/ray_world_game/
            flutter-version: '3.7.10'
            build-args: "--web-renderer html"
            target: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: check
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -qE "^${{ matrix.working-directory }}/|^\.github/workflows/deploy-games\.yaml$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore cached build
        id: cache
        if: steps.check.outputs.changed == 'false'
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.working-directory }}/build/web
          key: pages-${{ matrix.project }}-${{ github.sha }}
          restore-keys: |
            pages-${{ matrix.project }}-

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.changed == 'true' || steps.cache.outputs.cache-hit != 'true'
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: 'stable'

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true' || steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.working-directory }}
        run: flutter pub get

      - name: Build web
        if: steps.check.outputs.changed == 'true' || steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.working-directory }}
        run: flutter build web --release --base-href "${{ matrix.base-href }}" ${{ matrix.build-args }} ${{ matrix.target }}

      - name: Save build cache
        if: steps.check.outputs.changed == 'true' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.working-directory }}/build/web
          key: pages-${{ matrix.project }}-${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: ${{ matrix.working-directory }}/build/web

  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare tiny_swords
        run: |
          mkdir -p tiny_swords_deploy
          rsync -a \
            --exclude='node_modules' --exclude='tests' --exclude='test-results' \
            --exclude='.github' --exclude='.gitignore' --exclude='package.json' \
            --exclude='package-lock.json' --exclude='eslint.config.js' \
            --exclude='playwright.config.js' --exclude='CLAUDE.md' \
            tiny_swords/ tiny_swords_deploy/

      - name: Upload tiny_swords artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny_swords
          path: tiny_swords_deploy

      - name: Prepare player_ns_shaft
        run: |
          mkdir -p player_ns_shaft_deploy
          rsync -a \
            --exclude='node_modules' --exclude='tests' --exclude='test-results' \
            --exclude='.github' --exclude='.gitignore' --exclude='package.json' \
            --exclude='package-lock.json' --exclude='eslint.config.js' \
            --exclude='playwright.config.js' --exclude='CLAUDE.md' \
            --exclude='lib' --exclude='test' --exclude='android' --exclude='ios' \
            --exclude='windows' --exclude='web' --exclude='pubspec.*' \
            --exclude='analysis_options.yaml' --exclude='.metadata' \
            --exclude='coverage_badge.svg' --exclude='l10n.yaml' \
            --exclude='.dart_tool' --exclude='.packages' --exclude='build' \
            player_ns_shaft/ player_ns_shaft_deploy/

      - name: Upload player_ns_shaft artifact
        uses: actions/upload-artifact@v4
        with:
          name: player_ns_shaft
          path: player_ns_shaft_deploy

      - name: Build water_sort_puzzle
        working-directory: water_sort_puzzle
        run: |
          npm ci
          npm run build

      - name: Upload water_sort_puzzle artifact
        uses: actions/upload-artifact@v4
        with:
          name: water_sort_puzzle
          path: water_sort_puzzle/dist

      - name: Build water_bottle_flip
        working-directory: water_bottle_flip
        run: |
          npm ci
          npm run build

      - name: Upload water_bottle_flip artifact
        uses: actions/upload-artifact@v4
        with:
          name: water_bottle_flip
          path: water_bottle_flip/dist

      - name: Build stock_trading_game
        working-directory: stock_trading_game
        run: |
          npm ci
          npm run build

      - name: Upload stock_trading_game artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock_trading_game
          path: stock_trading_game/dist

      - name: Upload sokoban artifact
        uses: actions/upload-artifact@v4
        with:
          name: sokoban
          path: sokoban

  deploy:
    needs: [build-flutter, build-static]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: combined

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build-flutter, build-static, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set notification details
        id: details
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=✅ 部署成功" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT
          else
            FAILED_JOBS=""
            if [ "${{ needs.build-flutter.result }}" = "failure" ]; then
              FAILED_JOBS="build-flutter"
            fi
            if [ "${{ needs.build-static.result }}" = "failure" ]; then
              FAILED_JOBS="${FAILED_JOBS:+$FAILED_JOBS, }build-static"
            fi
            if [ "${{ needs.deploy.result }}" = "failure" ]; then
              FAILED_JOBS="${FAILED_JOBS:+$FAILED_JOBS, }deploy"
            fi
            echo "status=❌ 建置失敗 (${FAILED_JOBS:-unknown})" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${{ steps.details.outputs.status }}\",
                \"description\": \"**Repo:** ${{ github.repository }}\n**Branch:** ${{ github.ref_name }}\n**Commit:** [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\n**Workflow:** [查看詳情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",
                \"color\": ${{ steps.details.outputs.color }}
              }]
            }" \
            "$DISCORD_WEBHOOK_URL"
