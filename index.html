<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul's Playbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 2.5rem;
    }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      max-width: 900px;
      width: 100%;
    }
    a.card {
      display: block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: #e2e8f0;
      transition: transform 0.15s, border-color 0.15s;
    }
    a.card:hover {
      transform: translateY(-2px);
      border-color: #60a5fa;
    }
    a.card h2 { font-size: 1.15rem; margin-bottom: 0.35rem; }
    a.card .tag {
      display: inline-block;
      font-size: 0.75rem;
      background: #334155;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>Paul's Playbox</h1>
  <p class="subtitle">A collection of game experiments</p>
  <div class="games">
    <a class="card" href="flutter_breakout/">
      <h2>Flutter Breakout</h2>
      <span class="tag">Flutter</span>
    </a>
    <a class="card" href="flutter_tetris/">
      <h2>Flutter Tetris</h2>
      <span class="tag">Flutter</span>
    </a>
    <a class="card" href="knight_counter_demo/">
      <h2>Knight Counter Demo</h2>
      <span class="tag">Flutter</span>
    </a>
    <a class="card" href="player_ns_shaft/">
      <h2>Player NS Shaft</h2>
      <span class="tag">Flutter</span>
    </a>
    <a class="card" href="ray_world_game/">
      <h2>Ray World Game</h2>
      <span class="tag">Flutter</span>
    </a>
    <a class="card" href="water_sort_puzzle/">
      <h2>Water Sort Puzzle</h2>
      <span class="tag">Flutter</span>
    </a>
    <a class="card" href="tiny_swords/">
      <h2>Tiny Swords RTS</h2>
      <span class="tag">Phaser / JS</span>
    </a>
  </div>
</body>
</html>
