<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul's Playbox</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="保羅的遊樂場 - Paul's Playbox">
  <meta property="og:description" content="遊戲是第九藝術，喜歡遊戲，熱愛遊戲，持續追尋創意">
  <meta property="og:image" content="https://easylive1989.github.io/paul-playbox/public/avatar.png">
  <meta property="og:url" content="https://easylive1989.github.io/paul-playbox/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="保羅的遊樂場 - Paul's Playbox">
  <meta name="twitter:description" content="遊戲是第九藝術，喜歡遊戲，熱愛遊戲，持續追尋創意">
  <meta name="twitter:image" content="https://easylive1989.github.io/paul-playbox/public/avatar.png">

  <link rel="icon" type="image/png" sizes="32x32" href="public/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="public/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="public/favicon/apple-touch-icon.png">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9031377620197189" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    // Apply theme before render to prevent flash
    (function() {
      const params = new URLSearchParams(window.location.search);
      const queryTheme = params.get('theme');
      const theme = queryTheme === 'dark' || queryTheme === 'light' ? queryTheme : localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'cursive'],
            display: ['"Noto Sans TC"', 'sans-serif'],
            body: ['Outfit', 'sans-serif'],
          },
          colors: {
            navy: {
              900: '#0b1120',
              800: '#0f172a',
              700: '#1e293b',
              600: '#334155',
            },
            accent: {
              DEFAULT: '#60a5fa',
              bright: '#93c5fd',
              dim: '#3b82f6',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; }

    /* Scanline overlay for retro feel */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Animations */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .animate-header {
      opacity: 0;
      animation: fadeSlideUp 0.6s ease-out 0.2s forwards;
    }

    .animate-nav {
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.3s forwards;
    }

    .animate-card {
      opacity: 0;
      animation: fadeSlideUp 0.5s ease-out forwards;
    }

    .animate-footer {
      opacity: 0;
      animation: fadeIn 0.6s ease-out 1.2s forwards;
    }

    .card-hover {
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .card-hover:hover {
      transform: scale(1.03);
      border-color: #60a5fa;
    }
    .card-hover:hover {
      box-shadow: 0 8px 32px rgba(96, 165, 250, 0.1), 0 0 0 1px rgba(96, 165, 250, 0.2);
    }
    .dark .card-hover:hover {
      box-shadow: 0 8px 32px rgba(96, 165, 250, 0.15), 0 0 0 1px rgba(96, 165, 250, 0.3);
    }

    /* Theme toggle */
    .theme-toggle {
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .avatar-float {
      animation: float 3s ease-in-out infinite;
    }

    .play-btn {
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .play-btn:hover {
      background-color: #3b82f6;
      transform: translateY(-1px);
    }

    /* Nav link underline animation */
    .nav-link {
      position: relative;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: #60a5fa;
      transition: width 0.25s ease;
    }
    .nav-link:hover::after {
      width: 100%;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-navy-900 dark:text-slate-200 min-h-screen flex flex-col">

  <!-- Subtle gradient background -->
  <div class="fixed inset-0 -z-10">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-50 via-white to-slate-50 dark:from-navy-900 dark:via-navy-800 dark:to-navy-900"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-accent/[0.02] dark:bg-accent/[0.04] rounded-full blur-[120px]"></div>
  </div>

  <!-- Header -->
  <header class="w-full max-w-5xl mx-auto px-6 pt-8 pb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
    <!-- Left: Avatar + Title -->
    <div class="animate-header flex items-center gap-5">
      <img
        src="public/avatar.png"
        alt="Paul's avatar"
        class="avatar-float w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-slate-200 dark:border-navy-600 shadow-lg"
        style="image-rendering: pixelated;"
      >
      <div>
        <h1 class="font-display text-2xl sm:text-3xl text-slate-900 dark:text-white font-black tracking-tight">保羅的遊樂場</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1 font-light tracking-wide">遊戲是第九藝術，喜歡遊戲，熱愛遊戲，持續追尋創意</p>
      </div>
    </div>

    <!-- Right: Nav -->
    <nav class="animate-nav flex items-center gap-6 text-sm font-medium">
      <a href="#" class="nav-link text-accent-dim dark:text-accent hover:text-accent-dim dark:hover:text-accent-bright">Home</a>
      <a href="https://github.com/easylive1989/paul-playbox" target="_blank" class="nav-link text-slate-500 dark:text-slate-400 hover:text-accent-dim dark:hover:text-accent">Github</a>
      <a href="mailto:easylive1989@gmail.com" class="nav-link text-slate-500 dark:text-slate-400 hover:text-accent-dim dark:hover:text-accent">Contact</a>
      <button id="theme-toggle" class="theme-toggle flex items-center justify-center w-8 h-8 rounded-full hover:bg-slate-200 dark:hover:bg-navy-600 transition-colors" aria-label="Toggle theme">
        <span id="theme-icon" class="flex items-center justify-center"></span>
      </button>
    </nav>
  </header>

  <!-- Divider -->
  <div class="w-full max-w-5xl mx-auto px-6">
    <div class="h-px bg-gradient-to-r from-transparent via-slate-200 dark:via-navy-600 to-transparent"></div>
  </div>

  <!-- Game Grid -->
  <main class="flex-1 w-full max-w-5xl mx-auto px-6 py-10">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="game-grid">
    </div>
  </main>

  <!-- Footer -->
  <footer class="animate-footer w-full max-w-5xl mx-auto px-6 py-8 text-center">
    <div class="h-px bg-gradient-to-r from-transparent via-slate-200 dark:via-navy-600 to-transparent mb-6"></div>
    <p class="text-slate-400 dark:text-slate-500 text-sm">&copy; 2026 Paul Wu. All rights reserved.</p>
  </footer>

  <script>
    const games = [
      { name: 'Flutter Breakout', image: 'public/breakout.png', url: 'flutter_breakout/' },
      { name: 'Flutter Tetris', image: 'public/tetris.png', url: 'flutter_tetris/' },
      { name: 'Player NS Shaft', image: 'public/ns_shaft.png', url: 'player_ns_shaft/' },
      { name: 'Ray World Game', image: 'public/ray world.png', url: 'ray_world_game/' },
      { name: 'Water Sort Puzzle', image: 'public/water_sort_puzzle.png', url: 'water_sort_puzzle/' },
      { name: 'Tiny Swords RTS', image: 'public/tiny_swords.png', url: 'tiny_swords/' },
      { name: 'Stock Trading', image: 'public/stock_trading.png', url: 'stock_trading_game/' },
      { name: 'Water Bottle Flip', image: 'public/water_bottle_flip.svg', url: 'water_bottle_flip/' },
      { name: 'Sokoban', image: 'public/sokoban.svg', url: 'sokoban/' },
    ];

    const grid = document.getElementById('game-grid');

    games.forEach((game, i) => {
      const delay = 0.3 + i * 0.1;
      const card = document.createElement('a');
      card.href = game.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.className = 'animate-card card-hover group block bg-white dark:bg-navy-700/50 border border-slate-200 dark:border-navy-600 rounded-2xl overflow-hidden shadow-sm dark:shadow-none backdrop-blur-sm';
      card.style.animationDelay = `${delay}s`;
      card.innerHTML = `
        <div class="aspect-video overflow-hidden bg-slate-100 dark:bg-navy-800">
          <img
            src="${game.image}"
            alt="${game.name} screenshot"
            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
            loading="lazy"
          >
        </div>
        <div class="p-4 flex items-center justify-between">
          <h2 class="font-pixel text-xs text-slate-900 dark:text-white leading-relaxed">${game.name}</h2>
          <span class="play-btn inline-block bg-accent-dim dark:bg-accent/80 text-white dark:text-navy-900 text-xs font-semibold px-4 py-1.5 rounded-lg whitespace-nowrap">
            Play
          </span>
        </div>
      `;
      grid.appendChild(card);
    });

    // Ad card - 工商服務
    const adCard = document.createElement('div');
    const adDelay = 0.3 + games.length * 0.1;
    adCard.className = 'animate-card block bg-white dark:bg-navy-700/50 border border-slate-200 dark:border-navy-600 rounded-2xl overflow-hidden shadow-sm dark:shadow-none backdrop-blur-sm';
    adCard.style.animationDelay = `${adDelay}s`;
    adCard.innerHTML = `
      <div class="aspect-video overflow-hidden bg-slate-100 dark:bg-navy-800 flex items-center justify-center">
        <ins class="adsbygoogle"
             style="display:block;width:100%;height:100%"
             data-ad-client="ca-pub-9031377620197189"
             data-ad-slot="7560226822"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
      </div>
      <div class="p-4 flex items-center justify-between">
        <h2 class="font-pixel text-xs text-slate-900 dark:text-white leading-relaxed">工商服務</h2>
      </div>
    `;
    grid.appendChild(adCard);
    (adsbygoogle = window.adsbygoogle || []).push({});

    // Theme toggle
    const themeIcon = document.getElementById('theme-icon');
    const themeToggle = document.getElementById('theme-toggle');

    function updateIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        themeIcon.innerHTML = `<img src="public/sun.svg" width="20" height="20" alt="Switch to light mode" class="text-slate-300">`;
      } else {
        themeIcon.innerHTML = `<img src="public/moon.svg" width="20" height="20" alt="Switch to dark mode" class="text-slate-600">`;
      }
    }
    updateIcon();

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateIcon();
    });
  </script>

</body>
</html>
